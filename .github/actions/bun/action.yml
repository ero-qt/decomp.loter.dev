name: bun
description: Sets up Bun and installs the packages from the lockfile.

runs:
  using: composite
  steps:
    - name: set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - name: install packages
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
