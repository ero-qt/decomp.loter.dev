name: dotnet
description: Sets up the .NET SDK from the engine's global.json and caches the NuGet packages.

runs:
  using: composite
  steps:
    - name: set up .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: engines/dotnet/global.json
    - name: cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('engines/dotnet/global.json', 'engines/dotnet/src/Decomp.Dotnet.csproj') }}
