name: native tools
description: Sets up Emscripten, Meson and Ninja for the native engine.

inputs:
  packages:
    description: More apt packages to install next to Meson and Ninja.
    default: ''

runs:
  using: composite
  steps:
    - name: set up Emscripten
      uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      with:
        version: 6.0.9
    - name: install apt packages
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build $PACKAGES
