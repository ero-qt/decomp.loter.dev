name: page tests
description: Installs Chromium and downloads the built site, which the page tests open. Needs the packages installed.

runs:
  using: composite
  steps:
    - name: install Chromium
      shell: bash
      run: bunx playwright install --with-deps chromium
    - name: download the site
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: site
        path: artifacts/site
