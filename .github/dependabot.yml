version: 2

updates:
  - package-ecosystem: github-actions
    # lists the composite actions' folders too, because "/" only covers the workflows in .github/workflows
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # keeps typescript-6 on TypeScript 6, because the import check needs its language service
    ignore:
      - dependency-name: typescript-6
        update-types: ['version-update:semver-major']
    groups:
      packages:
        patterns: ['*']
