version: 2

updates:
  - package-ecosystem: github-actions
    # lists the composite actions' folders too, because "/" only covers the workflows in .github/workflows
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      packages:
        patterns: ['*']
