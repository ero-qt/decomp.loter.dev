name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# runs each step's script with pipefail, so a failing command in front of a pipe fails the step
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Bun and packages
        uses: ./.github/actions/bun
      - name: type check
        run: bun run check

  test-contract:
    name: test contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Bun and packages
        uses: ./.github/actions/bun
      - name: run the tests
        run: |
          for file in contract/*.test.ts; do
            bun test "./$file"
          done

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: set up Bun and packages
        uses: ./.github/actions/bun
      - name: set up the native tools
        uses: ./.github/actions/native-tools
      - name: read the tools' versions
        id: tools
        run: echo "hash=$({ emcc --version; meson --version; ninja --version; } | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"
      - name: read the submodules' commits
        id: submodules
        run: echo "hash=$(git submodule status --recursive | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"
      # keeps the build of Rizin and rz-ghidra, because the first build takes about 17 minutes, and
      # restores the last build with the same tools after a change, whose stamps then only rebuild what changed
      - name: cache the native build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/native
          key: >-
            native-${{ runner.os }}-${{ steps.tools.outputs.hash }}-${{ steps.submodules.outputs.hash }}-${{
            hashFiles('engines/native/build/**', 'engines/native/src/**', 'engines/native/build.ts') }}
          restore-keys: native-${{ runner.os }}-${{ steps.tools.outputs.hash }}-
      - name: build the native module
        run: bun --eval "import { buildModule } from './engines/native/build/link'; await buildModule();"
      - name: upload the native module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native
          path: artifacts/native/out
          retention-days: 3

  build:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Bun and packages
        uses: ./.github/actions/bun
      - name: set up .NET SDK
        uses: ./.github/actions/dotnet
      - name: download the native module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: artifacts/native/out
      # copies the module that the native job built, so this job doesn't need Emscripten
      - name: build the site
        env:
          NATIVE_MODULE: artifacts/native/out
        run: bun run build
      - name: upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: artifacts/site
          retention-days: 3

  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      folders: ${{ steps.folders.outputs.folders }}
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lists each engine's folder with a manifest and the folders of the host, the release scripts and the shell, but
      # not the native engine's and the shared helpers', whose tests run in their own jobs
      - name: list the test folders
        id: folders
        run: |
          {
            dirname engines/*/manifest.json | grep -vx engines/native
            printf '%s\n' host release shell
          } | sort | jq -Rcs '"folders=" + (split("\n")[:-1] | tojson)' -r >> "$GITHUB_OUTPUT"

  # sets up the JDK for a folder with Java fixture sources, the .NET SDK for a folder with a C# project and runs the
  # folder's own ci-setup.sh, so an engine only adds files to its own folder
  test:
    name: test ${{ matrix.folder }}
    needs: [list, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.list.outputs.folders) }}
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Bun and packages
        uses: ./.github/actions/bun
      - name: set up JDK 21
        if: hashFiles(format('{0}/fixture/**/*.java', matrix.folder)) != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: set up .NET SDK
        if: hashFiles(format('{0}/**/*.csproj', matrix.folder)) != ''
        uses: ./.github/actions/dotnet
      - name: run the folder's setup
        if: hashFiles(format('{0}/ci-setup.sh', matrix.folder)) != ''
        env:
          FOLDER: ${{ matrix.folder }}
        run: '"$FOLDER/ci-setup.sh"'
      - name: set up the page tests
        uses: ./.github/actions/page-tests
      - name: run the tests
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          shopt -s globstar
          for file in "$FOLDER"/**/*.test.ts; do
            bun test "./$file"
          done

  # sets up the tools of every engine's fixture by the same markers, because the claims test reads every fixture, and
  # skips the site and the browser, which its tests don't use
  test-shared:
    name: test engines/shared
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: set up Bun and packages
        uses: ./.github/actions/bun
      - name: set up JDK 21
        if: hashFiles('engines/*/fixture/**/*.java') != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: set up .NET SDK
        if: hashFiles('engines/*/**/*.csproj') != ''
        uses: ./.github/actions/dotnet
      - name: run the engines' setups
        run: |
          for script in engines/*/ci-setup.sh; do
            if [ -f "$script" ]; then
              "$script"
            fi
          done
      - name: run the tests
        run: |
          shopt -s globstar
          for file in engines/shared/**/*.test.ts; do
            bun test "./$file"
          done

  test-native:
    name: test engines/native
    needs: [native, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: set up Bun and packages
        uses: ./.github/actions/bun
      # installs the clang and LLVM's tools that build the fixture, because Emscripten's LLVM only builds WebAssembly
      - name: set up the native tools
        uses: ./.github/actions/native-tools
        with:
          packages: clang lld llvm
      # takes the newest LLVM folder with the fixture's tools, because the runner has more than one
      - name: find LLVM's folder
        run: |
          for folder in $(ls -d /usr/lib/llvm-*/bin | sort -rV); do
            if [ -x "$folder/clang++" ] && [ -x "$folder/ld.lld" ] && [ -x "$folder/llvm-lipo" ]; then
              echo "NATIVE_LLVM=$folder" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No folder in /usr/lib has clang++, ld.lld and llvm-lipo." >&2
          exit 1
      - name: set up the page tests
        uses: ./.github/actions/page-tests
      # takes the module with its stamp, which matches the same commit and tools, so the tests don't build it again
      - name: download the native module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: artifacts/native/out
      - name: run the tests
        run: |
          for file in engines/native/*.test.ts; do
            bun test "./$file"
          done
