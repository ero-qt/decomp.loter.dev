name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: bun run check

  test-contract:
    name: test contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the tests
        run: |
          for file in contract/*.test.ts; do
            bun test "./$file"
          done

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: engines/dotnet/global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engines/dotnet/global.json', 'engines/dotnet/src/Decomp.Dotnet.csproj') }}
      - name: Install packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the site
        run: bun run build
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: artifacts/site
          retention-days: 3

  test:
    name: test ${{ matrix.folder }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        folder:
          - engines/dotnet
          - engines/fake
          - engines/java
          - shell
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Set up JDK 21
        if: matrix.folder == 'engines/java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up .NET SDK
        if: matrix.folder == 'engines/dotnet'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: engines/dotnet/global.json
      - name: Cache NuGet packages
        if: matrix.folder == 'engines/dotnet'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('engines/dotnet/global.json', 'engines/dotnet/src/Decomp.Dotnet.csproj') }}
      - name: Install packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: artifacts/site
      - name: Run the tests
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          shopt -s globstar
          for file in "$FOLDER"/**/*.test.ts; do
            bun test "./$file"
          done
