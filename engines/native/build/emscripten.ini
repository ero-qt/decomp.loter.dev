# Meson cross file of Rizin's build with Emscripten, for a static and single-threaded WebAssembly module. Meson links
# its configure checks with these link flags, and link.ts links the module with its own.
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
ranlib = 'emranlib'

[built-in options]
c_args = ['-Oz', '-DHAVE_PTY=0', '-DHAVE_FORK=0', '-D__EMSCRIPTEN__=1']
c_link_args = ['-sALLOW_MEMORY_GROWTH=1', '-sERROR_ON_UNDEFINED_SYMBOLS=0', '-sEMULATE_FUNCTION_POINTER_CASTS=1', '-sFORCE_FILESYSTEM=1']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
