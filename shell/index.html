          <h1>decomp.loter.dev</h1>
          <p>Decompiler that runs entirely in your browser.</p>

        <section class="usage">
          <h2>How to use</h2>
          <p>Drop files or folders anywhere on the page, or use Open Files and Open Folder in the Symbols view. Click a symbol to
            open it, and right-click its tab to open its other views to the side.</p>

          <h3>Supported files</h3>
          <table>
            <thead><tr><th>Format</th><th>Files</th><th>Views</th></tr></thead>
            <tbody>
              <tr><td>Fake test files</td><td><code>.fake</code></td><td>Code, Ops</td></tr>
            </tbody>
          </table>

          <h3>Keyboard shortcuts</h3>
          <table>
            <tbody>
              <tr><td>Go to definition</td><td><kbd>F12</kbd> or <kbd>Ctrl</kbd>+click</td></tr>
              <tr><td>Find references</td><td><kbd>Shift</kbd>+<kbd>F12</kbd></td></tr>
              <tr><td>Find symbol</td><td><kbd>Ctrl</kbd>+<kbd>T</kbd></td></tr>
              <tr><td>Find string</td><td><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd></td></tr>
              <tr><td>Command palette</td><td><kbd>F1</kbd></td></tr>
              <tr><td>Change shortcuts</td><td><kbd>Ctrl</kbd>+<kbd>K</kbd> <kbd>Ctrl</kbd>+<kbd>S</kbd></td></tr>
            </tbody>
          </table>
        </section>
